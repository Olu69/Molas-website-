<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOLAS Icon Maker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 18px;
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            color: #172033;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px 18px;
            border-radius: 22px;
        }

        h2 {
            margin: 0 0 8px;
            color: #101b4d;
            font-size: 23px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #5b6475;
        }

        canvas {
            display: block;
            width: 230px;
            height: 230px;
            max-width: 100%;
            margin: 24px auto;
            border-radius: 24px;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: #101b4d;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 16px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h2>MOLAS Icon Maker</h2>

        <p>
            Create a dedicated Home Screen icon
            using your existing MOLAS logo.
        </p>

        <canvas
            id="iconCanvas"
            width="512"
            height="512"
        ></canvas>

        <button id="downloadButton" disabled>
            Save MOLAS Icon
        </button>

        <p id="status">Loading your MOLAS logo...</p>

    </main>

    <script>
        const canvas = document.getElementById("iconCanvas");
        const ctx = canvas.getContext("2d");

        const button = document.getElementById("downloadButton");
        const status = document.getElementById("status");

        const logo = new Image();

        logo.onload = function () {
            // Navy-blue background
            ctx.fillStyle = "#E5E7EB";
            ctx.fillRect(0, 0, 512, 512);

            // Fit the original horizontal logo inside
            // the square without stretching it.
            const maxWidth = 420;
            const maxHeight = 220;

            const scale = Math.min(
                maxWidth / logo.naturalWidth,
                maxHeight / logo.naturalHeight
            );

            const width = logo.naturalWidth * scale;
            const height = logo.naturalHeight * scale;

            const x = (512 - width) / 2;
            const y = (512 - height) / 2;

            ctx.drawImage(
                logo,
                x,
                y,
                width,
                height
            );

            button.disabled = false;
            status.textContent = "Your MOLAS icon is ready!";
        };

        logo.onerror = function () {
            status.textContent =
                "Logo not found. Make sure molas.png is in the same project folder.";
        };

        logo.src = "molas.png";

        button.addEventListener("click", function () {
            canvas.toBlob(function (blob) {
                if (!blob) {
                    status.textContent =
                        "Could not create the image. Please try again.";
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = "molas-icon.png";

                document.body.appendChild(link);
                link.click();
                link.remove();

                setTimeout(function () {
                    URL.revokeObjectURL(url);
                }, 10000);

                status.textContent =
                    "Your icon has been created. Check your downloads.";
            }, "image/png");
        });
    </script>

</body>
</html>
