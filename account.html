<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>MOLAS Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --navy: #101B4D;
            --cyan: #18BFFF;
            --pale-blue: #F3FAFD;
            --charcoal: #172033;
            --cream: #F3EFE7;
            --border: #dfe6ed;
            --white: #ffffff;
            --muted: #697386;
            --danger: #b42318;
            --success: #087443;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            background: var(--pale-blue);
            color: var(--charcoal);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px 18px;
        }

        .account-wrapper {
            width: 100%;
            max-width: 410px;
        }

        .account-brand {
            text-align: center;
            margin-bottom: 18px;
        }

        .account-brand img {
            width: auto;
            height: 48px;
            display: block;
            margin: 0 auto 8px;
            object-fit: contain;
        }

        .account-brand p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .account-card {
            width: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(16, 27, 77, 0.08);
        }

        .account-title {
            text-align: center;
            margin-bottom: 18px;
        }

        .account-title h1 {
            color: var(--navy);
            font-size: 22px;
            line-height: 1.25;
            margin-bottom: 5px;
        }

        .account-title p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .account-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;

            padding: 4px;
            background: #f1f4f7;
            border-radius: 12px;

            margin-bottom: 18px;
        }

        .account-tab {
            border: none;
            background: transparent;
            color: var(--muted);

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            padding: 9px 8px;
            border-radius: 9px;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .account-tab.active {
            background: var(--white);
            color: var(--navy);
            box-shadow: 0 2px 8px rgba(16, 27, 77, 0.08);
        }

        .account-form {
            display: none;
        }

        .account-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            color: var(--charcoal);

            font-size: 11px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 10px;

            padding: 0 12px;

            font-family: inherit;
            font-size: 13px;
            color: var(--charcoal);

            background: #fff;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(24, 191, 255, 0.10);
        }

        .password-input {
            padding-right: 64px !important;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: var(--navy);

            font-family: inherit;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .account-button {
            width: 100%;
            height: 43px;

            margin-top: 4px;

            border: none;
            border-radius: 11px;

            background: var(--navy);
            color: white;

            font-family: inherit;
            font-size: 12px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .account-button:hover {
            background: #172967;
        }

        .account-button:active {
            transform: scale(0.99);
        }

        .account-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .account-message {
            display: none;

            margin-bottom: 12px;
            padding: 9px 11px;

            border-radius: 9px;

            font-size: 11px;
            line-height: 1.5;
        }

        .account-message.show {
            display: block;
        }

        .account-message.error {
            color: var(--danger);
            background: #fff2f0;
            border: 1px solid #ffd4cf;
        }

        .account-message.success {
            color: var(--success);
            background: #effbf5;
            border: 1px solid #c8efd9;
        }

        .account-footer {
            text-align: center;
            margin-top: 15px;
        }

        .account-footer a {
            color: var(--navy);
            text-decoration: none;

            font-size: 11px;
            font-weight: 700;
        }

        .account-footer a:hover {
            color: var(--cyan);
        }

        @media (max-width: 380px) {

            body {
                padding: 16px 12px;
            }

            .account-card {
                padding: 19px 16px;
                border-radius: 20px;
            }

            .account-brand {
                margin-bottom: 13px;
            }

            .account-brand img {
                height: 42px;
            }

            .account-title h1 {
                font-size: 20px;
            }

            .account-title {
                margin-bottom: 15px;
            }

            .account-tabs {
                margin-bottom: 15px;
            }

            .form-group {
                margin-bottom: 10px;
            }

            .form-group input {
                height: 40px;
                font-size: 16px;
            }

            .account-button {
                height: 41px;
            }
        }

        @media (min-width: 768px) {

            body {
                padding: 30px;
            }

            .account-wrapper {
                max-width: 400px;
            }

        }
    </style>
</head>

<body>

    <main class="account-wrapper">

        <div class="account-brand">

            <img
                src="molas.png"
                alt="MOLAS Educational Consults"
            >

            <p>
                Your access point to MOLAS educational resources.
            </p>

        </div>


        <section class="account-card">

            <div class="account-title">

                <h1>
                    MOLAS Account
                </h1>

                <p>
                    Create an account or log in to continue.
                </p>

            </div>


            <div class="account-tabs">

                <button
                    type="button"
                    class="account-tab active"
                    id="signupTab"
                >
                    Create Account
                </button>

                <button
                    type="button"
                    class="account-tab"
                    id="loginTab"
                >
                    Log In
                </button>

            </div>


            <div
                class="account-message"
                id="accountMessage"
            ></div>


            <!-- SIGN UP -->

            <form
                class="account-form active"
                id="signupForm"
            >

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            class="password-input"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="signupPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="signupConfirmPassword"
                            class="password-input"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="signupConfirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="account-button"
                    id="signupButton"
                >
                    Create Account
                </button>

            </form>


            <!-- LOGIN -->

            <form
                class="account-form"
                id="loginForm"
            >

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            class="password-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="loginPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="account-button"
                    id="loginButton"
                >
                    Log In
                </button>

            </form>


            <div class="account-footer">

                <a href="index.html">
                    ← Back to MOLAS
                </a>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://eidnzebqyxcpxbykybch.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Q81zflk66ijoYEpT_pqL1g_S-cSJSpj";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const signupTab =
            document.getElementById("signupTab");

        const loginTab =
            document.getElementById("loginTab");

        const signupForm =
            document.getElementById("signupForm");

        const loginForm =
            document.getElementById("loginForm");

        const accountMessage =
            document.getElementById("accountMessage");


        const params =
            new URLSearchParams(window.location.search);

        const requestedResource =
            params.get("resource") || "jamb";


        function getResourceDestination() {

            if (requestedResource === "waec") {
                return "waec.html";
            }

            if (requestedResource === "post-utme") {
                return "post-utme.html";
            }

            return "jamb-resources.html";
        }


        function showMessage(message, type) {

            accountMessage.textContent = message;

            accountMessage.className =
                "account-message show " + type;

        }


        function clearMessage() {

            accountMessage.textContent = "";

            accountMessage.className =
                "account-message";

        }


        function showSignup() {

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

            signupForm.classList.add("active");
            loginForm.classList.remove("active");

            clearMessage();

        }


        function showLogin() {

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

            loginForm.classList.add("active");
            signupForm.classList.remove("active");

            clearMessage();

        }


        signupTab.addEventListener(
            "click",
            showSignup
        );


        loginTab.addEventListener(
            "click",
            showLogin
        );


        document
            .querySelectorAll(".toggle-password")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const target =
                            document.getElementById(
                                button.dataset.target
                            );

                        if (target.type === "password") {

                            target.type = "text";

                            button.textContent = "Hide";

                        } else {

                            target.type = "password";

                            button.textContent = "Show";

                        }

                    }
                );

            });


        signupForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();

                const name =
                    document
                        .getElementById("signupName")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("signupEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("signupPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById(
                            "signupConfirmPassword"
                        )
                        .value;

                const button =
                    document.getElementById(
                        "signupButton"
                    );


                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Creating Account...";


                const {
                    data,
                    error
                } = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: name
                        }

                    }

                });


                button.disabled = false;

                button.textContent =
                    "Create Account";


                if (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                if (data.session) {

                    localStorage.setItem(
                        "molas_jamb_last_activity",
                        Date.now().toString()
                    );

                    window.location.href =
                        getResourceDestination();

                    return;

                }


                showMessage(
                    "Your account has been created. Please check your email to confirm your account, then log in.",
                    "success"
                );

            }
        );


        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                clearMessage();

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                const button =
                    document.getElementById(
                        "loginButton"
                    );


                button.disabled = true;

                button.textContent =
                    "Logging In...";


                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                button.disabled = false;

                button.textContent =
                    "Log In";


                if (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                if (data.session) {

                    localStorage.setItem(
                        "molas_jamb_last_activity",
                        Date.now().toString()
                    );

                    window.location.href =
                        getResourceDestination();

                }

            }
        );


        async function checkExistingSession() {

    const {
        data
    } = await supabaseClient.auth.getSession();


    if (!data.session) {
        return;
    }


    const lastActivity =
        Number(
            localStorage.getItem(
                "molas_jamb_last_activity"
            )
        );


    const JAMB_INACTIVITY_LIMIT =
        2 * 60 * 1000;


    const activityIsActive =
        lastActivity &&
        Date.now() - lastActivity <
        JAMB_INACTIVITY_LIMIT;


    if (activityIsActive) {

        window.location.href =
            getResourceDestination();

    }

}


checkExistingSession();

    </script>

</body>
</html>
